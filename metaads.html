<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metrocasa · Comparativo Meta ADS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--red:#E2231A;--red-deep:#A50F12;--red-soft:#FCE9E8;--gold:#C9A227;--ink:#16161A;--ink-2:#3B3B42;--muted:#7A7A85;--line:#E7E7EC;--surface:#FFFFFF;--bg:#F4F4F6;--bg-2:#ECECEF;--good:#1B7A3D;--good-bg:#E7F6EC;--warn:#9A6212;--warn-bg:#FFF4E5;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -12px rgba(20,20,26,.18);--anterior:#9AA0A6;--atual:#E2231A;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 48px)}
  .logo{font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}.logo .plus{color:var(--red)}
  .topbar{background:linear-gradient(135deg,var(--ink),#26262E);color:#fff;position:relative;overflow:hidden;border-radius:0 0 22px 22px;padding:calc(env(safe-area-inset-top) + 20px) 22px 20px;box-shadow:var(--shadow);margin:0 -16px 20px}
  .topbar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
  .tb-row{display:flex;align-items:center;gap:13px;max-width:1240px;margin:0 auto}
  .tb-row .mark{width:44px;height:44px;border-radius:12px;flex:0 0 auto}
  .tb-title .logo{font-size:21px}.tb-title .st{font-size:12px;color:rgba(255,255,255,.6);font-weight:500;margin-top:2px}
  .tb-actions{margin-left:auto;display:flex;gap:8px}
  .tb-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;height:40px;padding:0 14px;font-family:'Sora',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .tb-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tb-btn.spinning svg{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .srcs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .src{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;border-radius:999px;padding:6px 12px}
  .src .d{width:8px;height:8px;border-radius:50%}
  .src.snap{background:var(--bg-2);color:var(--ink-2)}.src.snap .d{background:var(--muted)}
  .src.live{background:var(--good-bg);color:var(--good)}.src.live .d{background:#27AE60}
  .src.warn{background:var(--warn-bg);color:var(--warn)}.src.warn .d{background:#E0902F}
  details.sources{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  details.sources summary{cursor:pointer;padding:13px 16px;font-family:'Sora',sans-serif;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:9px}
  details.sources summary::-webkit-details-marker{display:none}
  details.sources summary::before{content:"▸";color:var(--red);transition:.15s}
  details.sources[open] summary::before{transform:rotate(90deg)}
  .srcbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
  .srcrow{display:flex;flex-direction:column;gap:5px}
  .srcrow label{font-size:11px;color:var(--muted);font-weight:700}
  .srcrow input{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-family:inherit;font-size:12.5px;background:var(--bg)}
  .srcbtn{align-self:flex-start;background:var(--red);color:#fff;border:none;border-radius:9px;height:38px;padding:0 18px;font-family:'Sora',sans-serif;font-weight:600;font-size:13px;cursor:pointer}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5}
  .filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
  .fg{flex:1 1 200px;min-width:160px;display:flex;flex-direction:column;gap:6px}
  .fg label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .fg select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font-family:inherit;font-size:13.5px;background:var(--bg);cursor:pointer}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
  .kpi .khead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
  .kpi .kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;line-height:1.2}
  .kpi .kbadge{font-family:'Sora',sans-serif;font-size:9.5px;font-weight:700;background:var(--bg-2);color:var(--ink-2);border-radius:5px;padding:1px 6px;flex:0 0 auto}
  .kpi .kv{font-family:'Sora',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1}
  .kpi .kavg{font-size:11.5px;color:var(--ink-2);margin-top:5px}.kpi .kavg b{color:var(--ink)}
  .kpi .kdelta{font-size:11px;font-weight:700;font-family:'Sora',sans-serif;margin-top:6px;color:var(--muted)}
  .kpi .kdelta.up{color:var(--good)}.kpi .kdelta.down{color:var(--red-deep)}.kpi .kdelta.flat{color:var(--muted)}
  .kpi .kdelta .ar{font-size:9px}
  .kpi .kwarn{font-size:10px;color:var(--warn);margin-top:5px;line-height:1.3}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .card-head{padding:15px 18px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card-head h3{font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px}.card-head .sub{font-size:11px;color:var(--muted);font-weight:600}
  .card-body{padding:14px 16px 16px}.span2{grid-column:1/-1}
  .chart-h{position:relative;height:300px}
  .legend{display:flex;gap:16px;margin-top:10px;justify-content:center;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);font-weight:600}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th:first-child{text-align:left}
  tbody td{padding:9px 12px;font-size:13px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  tbody td:first-child{text-align:left;font-weight:600;font-family:'Sora',sans-serif}
  tfoot td{padding:11px 12px;font-size:13px;text-align:right;border-top:2px solid var(--ink);font-family:'Sora',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
  tfoot td:first-child{text-align:left}
  tbody tr:hover{background:var(--red-soft)}
  .delta.up{color:var(--good)}.delta.down{color:var(--red-deep)}.delta.flat{color:var(--muted)}
  .metricsel{display:inline-flex;align-items:center;gap:8px}
  .metricsel select{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-family:inherit;font-size:12.5px;background:var(--bg);cursor:pointer}
  .empty{padding:36px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink-2);font-family:'Sora',sans-serif;margin-bottom:5px;font-size:15px}
  .note{background:var(--warn-bg);border:1px solid #F0C97A;border-radius:12px;padding:11px 15px;font-size:12px;color:#6b4a12;margin-bottom:16px;line-height:1.5}
  footer{margin-top:22px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}footer b{color:var(--ink-2)}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="tb-row">
    <svg class="mark" viewBox="0 0 512 512" id="mk"></svg>
    <div class="tb-title"><div class="logo">metrocasa<span class="plus">+</span></div><div class="st">Comparativo Meta ADS · mês anterior × mês atual</div></div>
    <div class="tb-actions"><button class="tb-btn" id="btnRefresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Atualizar</button></div>
  </div></div>

  <div class="srcs" id="srcs"></div>

  <div id="note"></div>

  <div class="filters">
    <div class="fg"><label>Conta (coluna A)</label><select id="fConta"><option value="">Todas as contas</option></select></div>
    <div class="fg"><label>Dia (coluna B)</label><select id="fDia"><option value="">Todos os dias</option></select></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card span2"><div class="card-head"><h3 id="cplTitle">Evolutiva da média do CPL · dia a dia</h3><div class="metricsel"><label class="sub" for="cplMonth">Período:</label><select id="cplMonth"><option value="ambos">Ambos (comparar)</option><option value="ant">Mês anterior</option><option value="atu">Mês atual</option></select></div></div><div class="card-body"><div class="chart-h"><canvas id="cCPL"></canvas></div><div class="legend" id="legCPL"></div></div></div>
    <div class="card span2"><div class="card-head"><h3 id="leadsTitle">Evolutiva de Leads na meta · dia a dia</h3><div class="metricsel"><label class="sub" for="leadsMonth">Período:</label><select id="leadsMonth"><option value="ambos">Ambos (comparar)</option><option value="ant">Mês anterior</option><option value="atu">Mês atual</option></select></div></div><div class="card-body"><div class="chart-h"><canvas id="cLeads"></canvas></div><div class="legend" id="legLeads"></div></div></div>
  </div>

  <div class="card"><div class="card-head"><h3>Comparativo detalhado</h3><span class="sub" id="cmpSub">totais, médias e variação</span></div><div class="card-body" id="cmp"></div></div>

  <div style="height:15px"></div>

  <div class="card"><div class="card-head"><h3>Dia a dia</h3><div class="metricsel"><label class="sub" for="dMetric">Métrica:</label><select id="dMetric"></select></div></div><div class="card-body" id="dayTbl"></div></div>

  <footer><b>Metrocasa · Marketing</b> — Comparativo Meta ADS · leitura ao vivo das duas páginas publicadas</footer>
</div>

<script>
/* ======= colunas (por posição A:N) ======= */
const IDX={conta:0,dia:1};
const COLS=[{k:'C',i:2},{k:'D',i:3},{k:'F',i:5},{k:'G',i:6},{k:'M',i:12},{k:'I',i:8},{k:'J',i:9},{k:'N',i:13}];
const DEF_LAB={C:'Coluna C',D:'Coluna D',F:'Coluna F',G:'CPL',M:'CTR',I:'Leads na meta',J:'Coluna J',N:'Coluna N'};
const RATIO=new Set(['G','M']);        // razão (CPL, CTR): soma não faz sentido — usar média
const PCT=new Set(['M']);              // colunas em porcentagem (exibe com %)
const EXCL_KPI=new Set(['J','N','M']);    // colunas fora dos cartões de totais
const EXCL_CMP=new Set(['J','N']);    // colunas fora do comparativo detalhado e do dia a dia
const EXCL_I='METROCASA[T2] MENSAGERIA'; // (legado) conta antes excluída da coluna I
// Coluna I (Leads na meta): conta SOMENTE estas contas. Edite a lista quando incluir/retirar contas.
const LEADS_CONTAS=['METROCASA[T1]','METROCASA[T2]','METROCASA[T3]','METROCASA[T4]','METROCASA[T5]'];
const POLL_MS=300000;

const KEY="2PACX-1vQYvTd23HfT7wXqzZZHwuPUOcdq4p7vTab9lIvs3RtmypT3NabBn8GRJKoflyiaDMkevMhTCWsaBZfn";
const PUBHTML="https://docs.google.com/spreadsheets/d/e/"+KEY+"/pubhtml";
const PUBBASE="https://docs.google.com/spreadsheets/d/e/"+KEY+"/pub";
const csvUrl=gid=>PUBBASE+"?gid="+gid+"&single=true&output=csv";
const htmlUrl=gid=>PUBHTML+"?gid="+gid+"&single=true&widget=false&headers=false";
const GID_ANT="0";          // mês anterior
const GID_ATU="593759433";  // mês atual

/* ======= snapshot ilustrativo (substituído pelos dados ao vivo) ======= */
function ex(conta,dia,C,D,F,H,I,J,N){return{conta,dia:String(dia),C,D,F,H,I,J,N};}
const SNAP_ANT=[
  ex('METROCASA',1,120,3000,80,9.5,42,12,4), ex('METROCASA',2,140,3200,90,9.1,48,14,5),
  ex('METROCASA',3,110,2800,70,10.2,38,10,3), ex('METROCASA[T2] MENSAGERIA',1,60,1500,40,7.0,20,6,2),
  ex('METROCASA[T2] MENSAGERIA',2,64,1600,42,7.2,22,7,2),
];
const SNAP_ATU=[
  ex('METROCASA',1,150,3600,95,8.4,55,16,6), ex('METROCASA',2,160,3800,100,8.0,61,18,7),
  ex('METROCASA',3,145,3500,92,8.7,52,15,5), ex('METROCASA[T2] MENSAGERIA',1,70,1700,45,6.5,25,8,3),
  ex('METROCASA[T2] MENSAGERIA',2,72,1750,46,6.4,27,9,3),
];

let ANT=[], ATU=[], LAB={...DEF_LAB};
let src={k:'snap',t:'Carregando…'};
let fConta='', fDia='', dMetric='G', cplMonth='ambos', leadsMonth='ambos';
let liveErr=false, ERRTXT='', TRIED={ant:'',atu:''};
let STAT_ANT=null, STAT_ATU=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const accKey=s=>norm(s).replace(/ /g,'');   // chave de conta sem espaços: "METROCASA [T1]" == "METROCASA[T1]"
const LEADS_SET=new Set(LEADS_CONTAS.map(accKey));
const NORM_EXCL=norm(EXCL_I);
function brNum(s){if(typeof s==='number')return s;if(s==null||s==='')return 0;let m=String(s).replace(/[^\d,.\-]/g,'');if(m.includes(',')&&m.includes('.'))m=m.replace(/\./g,'').replace(',','.');else if(m.includes(','))m=m.replace(',','.');const n=parseFloat(m);return isNaN(n)?0:n;}
function fmt(v){if(v==null||isNaN(v))return '—';const r=Math.round(v);if(Math.abs(v-r)<1e-9)return r.toLocaleString('pt-BR');return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
// valor de porcentagem robusto: "2,34%" -> 2.34 ; decimal "0,0234" -> 2.34
function pctVal(s){const str=String(s==null?'':s).trim();const n=brNum(str);if(str.includes('%'))return n;return (n>0&&n<=1)?n*100:n;}
// formata em % as colunas de porcentagem; demais usam fmt normal
function fmtM(k,v){if(v==null||isNaN(v))return '—';return PCT.has(k)?fmt(v)+'%':fmt(v);}
function dom(v){const s=String(v==null?'':v).trim();
  let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);      // ISO aaaa-mm-dd
  if(m)return +m[3];
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);   // dd/mm(/aaaa)
  if(m)return +m[1];
  const n=Number(s.replace(',','.'));
  if(!isNaN(n)){if(Number.isInteger(n)&&n>=1&&n<=31)return n;if(n>40000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return d.getUTCDate();}}
  m=s.match(/\b(\d{1,2})\b/);                                     // "01 de julho", "seg 5"
  if(m){const d=+m[1];if(d>=1&&d<=31)return d;}
  return 0;}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c==='\r'){}else f+=c;}}if(f.length||row.length){row.push(f);rows.push(row);}return rows;}

const PAL=['#E2231A','#16161A','#C9A227','#6B7280','#A50F12'];
let CH={};
function mkChart(id,cfg){const c=$(id);if(typeof Chart==='undefined'){if(c){c.style.display='none';const p=document.createElement('div');p.className='empty';p.innerHTML='<b>Gráfico indisponível</b>Sem conexão para carregar o Chart.js.';c.parentElement.appendChild(p);}return;}try{if(CH[id])CH[id].destroy();CH[id]=new Chart(c,cfg);}catch(e){}}

const mk=el=>{el.innerHTML=`<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2231A"/><stop offset="1" stop-color="#A50F12"/></linearGradient><mask id="lm"><rect width="512" height="512" fill="black"/><g fill="white"><rect x="134" y="360" width="244" height="22" rx="8"/><rect x="150" y="306" width="58" height="70" rx="9"/><rect x="227" y="256" width="58" height="120" rx="9"/><rect x="304" y="196" width="58" height="180" rx="9"/><rect x="322" y="144" width="22" height="56" rx="7"/><rect x="305" y="157" width="56" height="22" rx="7"/></g></mask></defs><rect width="512" height="512" rx="115" fill="url(#lg)"/><rect width="512" height="512" fill="white" mask="url(#lm)"/>`;};

/* ======= parse de uma página ======= */
function parsePage(grid){
  if(!grid||!grid.length)return{rows:[],lab:{...DEF_LAB},stats:{total:0,semB:0,semDia:0}};
  let hi=0;
  for(let i=0;i<Math.min(grid.length,12);i++){const a=norm(grid[i][0]||''),b=norm(grid[i][1]||'');
    if(a.includes('CONTA')||a.includes('NOME')||b==='DIA'||b.includes('DIA')){hi=i;break;}}
  const head=grid[hi]||[], lab={...DEF_LAB};
  COLS.forEach(c=>{const h=(head[c.i]||'').toString().trim();if(h)lab[c.k]=h;});
  const rows=[];let total=0,semB=0,semDia=0;
  for(let r=hi+1;r<grid.length;r++){const row=grid[r];if(!row)continue;
    const conta=(row[IDX.conta]||'').trim();
    if(!conta)continue;
    if(norm(conta).includes('TOTAL'))continue;
    total++;
    const dia=(row[IDX.dia]||'').trim();
    if(!dia){semB++;continue;}
    const d=dom(dia);if(!d)semDia++;
    const rec={conta,contaN:norm(conta),contaK:accKey(conta),dia,dom:d};
    COLS.forEach(c=>rec[c.k]=(c.k==='M')?pctVal(row[c.i]):brNum(row[c.i]));
    rows.push(rec);
  }
  return {rows,lab,stats:{total,semB,semDia}};
}

/* ======= agregações ======= */
function base(src){return src.filter(r=>(!fConta||r.conta===fConta)&&(!fDia||r.dom===+fDia));}
function rowsK(src,k){let rs=base(src);if(k==='I'&&LEADS_SET.size)rs=rs.filter(r=>LEADS_SET.has(r.contaK));return rs;}
function agg(src,k){const rs=rowsK(src,k);const s=rs.reduce((a,r)=>a+(r[k]||0),0);return{total:s,avg:rs.length?s/rs.length:0,n:rs.length};}
/* maior dia com dados no mês atual (respeita filtros) */
function maxDomOf(src){const ds=base(src).map(r=>r.dom).filter(Boolean);return ds.length?Math.max(...ds):0;}
/* agregação limitada até um dia (para comparar mesmo período) */
function aggCap(src,k,maxDom){let rs=rowsK(src,k);if(maxDom)rs=rs.filter(r=>r.dom&&r.dom<=maxDom);const s=rs.reduce((a,r)=>a+(r[k]||0),0);return{total:s,avg:rs.length?s/rs.length:0,n:rs.length};}
function byDay(src,k,mode){const rs=rowsK(src,k);const m={},c={};rs.forEach(r=>{if(!r.dom)return;m[r.dom]=(m[r.dom]||0)+(r[k]||0);c[r.dom]=(c[r.dom]||0)+1;});const o={};Object.keys(m).forEach(d=>o[+d]=mode==='mean'?m[d]/c[d]:m[d]);return o;}
/* média acumulada até cada dia (para a evolutiva do CPL) */
function byDayCumAvg(src,k){const rs=rowsK(src,k).filter(r=>r.dom);const days=[...new Set(rs.map(r=>r.dom))].sort((a,b)=>a-b);const o={};days.forEach(d=>{const up=rs.filter(r=>r.dom<=d);o[d]=up.length?up.reduce((s,r)=>s+(r[k]||0),0)/up.length:null;});return o;}
function axisDays(){const s=new Set();[ANT,ATU].forEach(src=>base(src).forEach(r=>{if(r.dom)s.add(r.dom);}));return[...s].sort((a,b)=>a-b);}

function deltaChip(a,b){if(b==null||b===0||isNaN(b))return`<span class="kdelta flat">—</span>`;const p=(a-b)/Math.abs(b)*100;const cls=p>0?'up':p<0?'down':'flat';const ar=p>0?'▲':p<0?'▼':'•';return`<span class="kdelta ${cls}"><span class="ar">${ar}</span> ${(p>=0?'+':'')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})}% vs mês ant.</span>`;}
function deltaCell(a,b){if(b==null||b===0||isNaN(b))return`<td class="delta flat">—</td>`;const p=(a-b)/Math.abs(b)*100;const cls=p>0?'up':p<0?'down':'flat';const ar=p>0?'▲':p<0?'▼':'•';return`<td class="delta ${cls}">${ar} ${(p>=0?'+':'')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</td>`;}

/* ======= render ======= */
function render(){
  $('srcs').innerHTML=`<span class="src ${src.k}"><span class="d"></span>${esc(src.t)}</span>`+
    `<span class="src snap"><span class="d"></span>Ant.: ${base(ANT).length} linha(s) · Atual: ${base(ATU).length} linha(s)</span>`;
  let noteHtml='';
  if(liveErr){noteHtml+=`<div class="note" style="background:#FDECEA;border-color:#F5A9A0;color:#8A1C12"><b>⚠ Você está vendo dados de EXEMPLO.</b> Não consegui carregar as duas páginas ao vivo (${esc(ERRTXT)}). Verifique se <b>as duas abas</b> estão publicadas em <b>CSV</b>: na planilha, <b>Arquivo → Compartilhar → Publicar na web</b>, escolha cada aba (ou "Documento inteiro"), formato <b>CSV</b>, e Publicar. Teste abrindo estes links no navegador — devem baixar um arquivo .csv:<br>• Mês anterior: <span style="word-break:break-all">${esc(TRIED.ant)}</span><br>• Mês atual: <span style="word-break:break-all">${esc(TRIED.atu)}</span></div>`;}
  noteHtml+=`<div class="note"><b>Como ler:</b> os totais e médias são do <b>mês atual</b>, com a variação % ao lado comparando ao mês anterior. A coluna <b>${esc(LAB.I)}</b> (col. I) conta <b>somente</b> as contas ${esc(LEADS_CONTAS.join(', '))}. A coluna <b>${esc(LAB.G)}</b> (col. G) é razão — a <b>soma</b> não faz sentido; use a <b>média</b>.</div>`;
  if(!liveErr&&(STAT_ATU||STAT_ANT)){
    const probs=[];
    if(STAT_ANT&&(STAT_ANT.semB||STAT_ANT.semDia))probs.push(`mês anterior: ${STAT_ANT.semB} sem dia (col. B vazia)${STAT_ANT.semDia?', '+STAT_ANT.semDia+' com formato não reconhecido':''}`);
    if(STAT_ATU&&(STAT_ATU.semB||STAT_ATU.semDia))probs.push(`mês atual: ${STAT_ATU.semB} sem dia (col. B vazia)${STAT_ATU.semDia?', '+STAT_ATU.semDia+' com formato não reconhecido':''}`);
    if(probs.length)noteHtml+=`<div class="note" style="background:#FDECEA;border-color:#F5A9A0;color:#8A1C12"><b>⚠ Coluna B (dia):</b> ${probs.join(' · ')}. Essas linhas <b>não entram</b> nos gráficos por dia nem no filtro de dia.</div>`;
    else noteHtml+=`<div class="note" style="background:var(--good-bg);border-color:#9AD3AE;color:#166534"><b>✓ Coluna B (dia):</b> todas as linhas têm dia reconhecido — mês atual ${STAT_ATU?STAT_ATU.total:0} linha(s), mês anterior ${STAT_ANT?STAT_ANT.total:0} linha(s).</div>`;
  }
  $('note').innerHTML=noteHtml;

  // filtros
  const contas=[...new Set([...ANT,...ATU].map(r=>r.conta))].sort((a,b)=>a.localeCompare(b,'pt'));
  const dias=[...new Set([...ANT,...ATU].map(r=>r.dom).filter(Boolean))].sort((a,b)=>a-b);
  $('fConta').innerHTML='<option value="">Todas as contas</option>'+contas.map(c=>`<option ${c===fConta?'selected':''}>${esc(c)}</option>`).join('');
  $('fDia').innerHTML='<option value="">Todos os dias</option>'+dias.map(d=>`<option value="${d}" ${String(d)===String(fDia)?'selected':''}>Dia ${d}</option>`).join('');
  $('dMetric').innerHTML=COLS.filter(c=>!EXCL_CMP.has(c.k)).map(c=>`<option value="${c.k}" ${c.k===dMetric?'selected':''}>${esc(LAB[c.k])}</option>`).join('');

  // KPIs
  $('kpis').innerHTML=COLS.filter(c=>!EXCL_KPI.has(c.k)).map(c=>{
    const a=agg(ATU,c.k), b=agg(ANT,c.k);
    if(RATIO.has(c.k)){
      return `<div class="kpi"><div class="khead"><span class="kl">${esc(LAB[c.k])}</span></div>`+
        `<div class="kv">${fmt(a.avg)}</div>`+
        `<div class="kavg">média do período</div>`+
        deltaChip(a.avg,b.avg)+
      `</div>`;
    }
    return `<div class="kpi"><div class="khead"><span class="kl">${esc(LAB[c.k])}</span></div>`+
      `<div class="kv">${fmt(a.total)}</div>`+
      `<div class="kavg">média <b>${fmt(a.avg)}</b></div>`+
      deltaChip(a.total,b.total)+
    `</div>`;
  }).join('');

  drawCPL(); drawLeads(); drawCmp(); drawDayTable();
}

function legHTML(sel){let s='';if(sel!=='atu')s+='<span><i style="background:var(--anterior)"></i>Mês anterior</span>';if(sel!=='ant')s+='<span><i style="background:var(--atual)"></i>Mês atual</span>';return s;}
function lineCfg(labels,ant,atu,sel){
  const ds=[];
  if(sel!=='atu')ds.push({label:'Mês anterior',data:ant,borderColor:'#9AA0A6',backgroundColor:'transparent',borderWidth:2,borderDash:[5,4],tension:.3,pointRadius:2,pointHoverRadius:5,spanGaps:true});
  if(sel!=='ant')ds.push({label:'Mês atual',data:atu,borderColor:'#E2231A',backgroundColor:'rgba(226,35,26,.07)',borderWidth:2.5,tension:.3,pointRadius:2.5,pointHoverRadius:6,fill:true,spanGaps:true});
  return{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>'Dia '+c[0].label,label:c=>c.dataset.label+': '+(c.parsed.y==null?'—':fmt(c.parsed.y))}}},scales:{x:{grid:{display:false},ticks:{color:'#7A7A85',font:{size:11}},title:{display:true,text:'Dia do mês',color:'#9AA0A6',font:{size:10}}},y:{grid:{color:'#EEE'},ticks:{color:'#7A7A85',callback:v=>fmt(v)},beginAtZero:true}}}};}

function drawCPL(){
  $('cplTitle').textContent=`Evolutiva da média do ${LAB.G} (acumulada) · dia a dia`;
  const days=axisDays();const a=byDayCumAvg(ANT,'G'),b=byDayCumAvg(ATU,'G');
  mkChart('cCPL',lineCfg(days,days.map(d=>a[d]??null),days.map(d=>b[d]??null),cplMonth));
  $('legCPL').innerHTML=legHTML(cplMonth);
}
function drawLeads(){
  $('leadsTitle').textContent=`Evolutiva de ${LAB.I} · dia a dia`;
  const days=axisDays();const a=byDay(ANT,'I','sum'),b=byDay(ATU,'I','sum');
  mkChart('cLeads',lineCfg(days,days.map(d=>a[d]??null),days.map(d=>b[d]??null),leadsMonth));
  $('legLeads').innerHTML=legHTML(leadsMonth);
}

function drawCmp(){
  const cut=maxDomOf(ATU);
  let body='';
  COLS.filter(c=>!EXCL_CMP.has(c.k)).forEach(c=>{const a=agg(ATU,c.k),b=aggCap(ANT,c.k,cut);
    if(RATIO.has(c.k)){
      body+=`<tr><td>${esc(LAB[c.k])}</td><td>—</td><td>—</td>${deltaCell(a.avg,b.avg)}<td>${fmtM(c.k,b.avg)}</td><td>${fmtM(c.k,a.avg)}</td></tr>`;
    }else{
      body+=`<tr><td>${esc(LAB[c.k])}</td><td>${fmtM(c.k,b.total)}</td><td>${fmtM(c.k,a.total)}</td>${deltaCell(a.total,b.total)}<td>${fmtM(c.k,b.avg)}</td><td>${fmtM(c.k,a.avg)}</td></tr>`;
    }});
  const sub=$('cmpSub');if(sub)sub.textContent=cut?`mês anterior considerado só até o dia ${cut} (mesmo período do mês atual)`:'totais, médias e variação';
  $('cmp').innerHTML=`<div style="overflow-x:auto"><table><thead><tr><th>Métrica</th><th>Total mês ant.</th><th>Total mês atual</th><th>Δ%</th><th>Média ant.</th><th>Média atual</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function drawDayTable(){
  const k=dMetric, mode=RATIO.has(k)?'mean':'sum';
  const days=axisDays();const a=byDay(ANT,k,mode),b=byDay(ATU,k,mode);
  if(!days.length){$('dayTbl').innerHTML='<div class="empty"><b>Sem dados</b>Ajuste os filtros ou carregue as fontes.</div>';return;}
  let body='';days.forEach(d=>{const va=a[d],vb=b[d];
    body+=`<tr><td>Dia ${d}</td><td>${va==null?'—':fmtM(k,va)}</td><td>${vb==null?'—':fmtM(k,vb)}</td>${(va==null||vb==null)?'<td class="delta flat">—</td>':deltaCell(vb,va)}</tr>`;});
  const ta=days.reduce((s,d)=>s+(a[d]||0),0), tb=days.reduce((s,d)=>s+(b[d]||0),0);
  const foot=mode==='sum'?`<tfoot><tr><td>Total</td><td>${fmtM(k,ta)}</td><td>${fmtM(k,tb)}</td>${deltaCell(tb,ta)}</tr></tfoot>`:'';
  $('dayTbl').innerHTML=`<div style="overflow-x:auto"><table><thead><tr><th>Dia</th><th>Mês anterior</th><th>Mês atual</th><th>Δ%</th></tr></thead><tbody>${body}</tbody>${foot}</table></div>`+
    (mode==='mean'?`<div class="hint" style="margin-top:8px">${esc(LAB[k])} é razão — cada dia mostra a média (não a soma).</div>`:'');
}

/* ======= carga ======= */
async function fetchCSV(url){const res=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now());if(!res.ok)throw new Error('HTTP '+res.status);const txt=await res.text();if(txt.trim().startsWith('<'))throw new Error('sem acesso (retornou HTML)');return parseCSV(txt).filter(r=>r.some(c=>String(c).trim()));}

/* lê a tabela da página publicada (pubhtml) — funciona quando só o formato "página web" foi publicado */
async function fetchGridHTML(gid){
  const res=await fetch(htmlUrl(gid)+'&_='+Date.now());
  if(!res.ok)throw new Error('HTTP '+res.status);
  const html=await res.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const tables=[...doc.querySelectorAll('table')];
  if(!tables.length)throw new Error('sem tabela');
  const t=tables.sort((a,b)=>b.querySelectorAll('tr').length-a.querySelectorAll('tr').length)[0];
  const grid=[];
  t.querySelectorAll('tr').forEach(tr=>{const cells=[...tr.children].filter(c=>c.tagName==='TD').map(c=>c.textContent.replace(/\u00a0/g,' ').trim());if(cells.length)grid.push(cells);});
  return grid;
}
async function fetchGrid(gid){
  try{const g=await fetchCSV(csvUrl(gid));if(g&&g.length>1)return{grid:g,via:'CSV'};}catch(e){}
  const g=await fetchGridHTML(gid);return{grid:g,via:'HTML'};
}

async function loadLive(){
  $('btnRefresh').classList.add('spinning');
  TRIED={ant:csvUrl(GID_ANT),atu:csvUrl(GID_ATU)};
  let okAnt=false,okAtu=false,lab={...DEF_LAB},errAtu='',errAnt='',viaAtu='',viaAnt='';
  try{const g=await fetchGrid(GID_ATU);const p=parsePage(g.grid);if(p.rows.length){ATU=p.rows;lab=p.lab;okAtu=true;viaAtu=g.via;STAT_ATU=p.stats;}else errAtu='0 linhas';}catch(e){errAtu=(e&&e.message)||'falha';}
  try{const g=await fetchGrid(GID_ANT);const p=parsePage(g.grid);if(p.rows.length){ANT=p.rows;okAnt=true;viaAnt=g.via;STAT_ANT=p.stats;}else errAnt='0 linhas';}catch(e){errAnt=(e&&e.message)||'falha';}
  if(okAtu||okAnt){LAB=lab;liveErr=false;
    const via=viaAtu||viaAnt;
    if(okAtu&&okAnt)src={k:'live',t:'Ao vivo · duas páginas'+(via?' (via '+via+')':'')};
    else src={k:'warn',t:'Ao vivo parcial — '+(okAtu?('mês anterior falhou: '+errAnt):('mês atual falhou: '+errAtu))};
  }else{ANT=[...SNAP_ANT];ATU=[...SNAP_ATU];LAB={...DEF_LAB};liveErr=true;ERRTXT=(errAtu||errAnt||'sem acesso');src={k:'warn',t:'⚠ EXEMPLO — dados ao vivo indisponíveis'};STAT_ANT=STAT_ATU=null;}
  $('btnRefresh').classList.remove('spinning');render();
}

/* persistência local das URLs (funciona no arquivo aberto localmente) */

mk($('mk'));
ANT=[...SNAP_ANT];ATU=[...SNAP_ATU];render();
$('fConta').onchange=e=>{fConta=e.target.value;render();};
$('fDia').onchange=e=>{fDia=e.target.value;render();};
$('dMetric').onchange=e=>{dMetric=e.target.value;drawDayTable();};
$('cplMonth').onchange=e=>{cplMonth=e.target.value;drawCPL();};
$('leadsMonth').onchange=e=>{leadsMonth=e.target.value;drawLeads();};
$('btnRefresh').onclick=loadLive;
loadLive();
setInterval(loadLive,POLL_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadLive();});
</script>
